name: Collect Purdue campus busyness

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      accept_identifiers:
        description: "Save strict, reviewed Google ID discoveries to location_registry.json"
        required: false
        type: boolean
        default: false
      location_id:
        description: "Optional internal location ID for a one-location validation run"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: purdue-busyness-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect busyness data
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          ACCEPT_IDENTIFIERS: ${{ inputs.accept_identifiers }}
          VALIDATION_LOCATION_ID: ${{ inputs.location_id }}
        run: |
          args=()
          if [ "$ACCEPT_IDENTIFIERS" = "true" ]; then
            args+=(--accept-discovered-identifiers)
          fi
          if [ -n "$VALIDATION_LOCATION_ID" ]; then
            args+=(--location-id "$VALIDATION_LOCATION_ID")
          fi
          python scrape_dining.py "${args[@]}"
      - name: Commit collected data
        run: |
          git config user.name "Purdue Busyness Bot"
          git config user.email "actions@github.com"
          git add data/ location_registry.json
          git diff --cached --quiet || git commit -m "Automated busyness collection"
          git push
